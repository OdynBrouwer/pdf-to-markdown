name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          # Pinned so CI writes/reads the same lockfile format as local dev.
          version: "0.12.13"
          enable-cache: true

      - name: Install the project
        # --locked fails the build if pyproject.toml and uv.lock disagree,
        # instead of quietly re-resolving and installing something else.
        run: uv sync --locked --python 3.12

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Test
        run: uv run --frozen pytest -q
